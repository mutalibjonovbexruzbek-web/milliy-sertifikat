<title>Milliy Sertifikat — Mirahmatov</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#070912;
    color:white;
    min-height:100vh;
}

header{
    height:75px;
    border-bottom:1px solid #ffffff15;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 5%;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#9d6cff;
}

.creator{
    color:#aaa;
    font-size:14px;
}

.container{
    width:92%;
    max-width:1100px;
    margin:auto;
}

.hero{
    padding:60px 0 35px;
}

.badge{
    display:inline-block;
    padding:9px 14px;
    border:1px solid #9d6cff66;
    border-radius:30px;
    color:#cfc0ff;
    font-size:13px;
}

.hero h1{
    font-size:clamp(40px,7vw,72px);
    line-height:1;
    margin:20px 0;
}

.hero p{
    max-width:700px;
    color:#aab2c5;
    line-height:1.7;
}

.subjects{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    padding-bottom:70px;
}

.subject{
    background:#111624;
    border:1px solid #ffffff12;
    border-radius:20px;
    padding:22px;
    min-height:170px;
    transition:.2s;
}

.subject:hover{
    transform:translateY(-4px);
    border-color:#9d6cff88;
}

.subject h3{
    margin-bottom:10px;
}

.subject p{
    color:#8992a7;
    font-size:14px;
    line-height:1.5;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

.startBtn{
    background:#9d6cff;
    color:white;
    margin-top:18px;
}

.secondary{
    background:#202738;
    color:white;
}

.test{
    background:#101522;
    border:1px solid #ffffff12;
    border-radius:22px;
    padding:25px;
    margin:35px 0;
}

.testTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.variant{
    color:#8d96aa;
    font-size:13px;
    margin-top:5px;
}

.timer{
    font-size:22px;
    font-weight:bold;
}

.progress{
    width:100%;
    height:8px;
    background:#252c3d;
    border-radius:20px;
    margin:22px 0;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0;
    background:#9d6cff;
}

.counter{
    color:#8d96aa;
    margin-bottom:15px;
}

.question{
    font-size:23px;
    line-height:1.5;
    margin-bottom:22px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.answer{
    background:#161d2d;
    border:1px solid #30394e;
    color:white;
    text-align:left;
    font-size:16px;
    padding:17px;
}

.answer:hover{
    border-color:#9d6cff;
}

.correct{
    background:#153c2a !important;
    border-color:#42d392 !important;
}

.wrong{
    background:#401b24 !important;
    border-color:#ff6375 !important;
}

.solution{
    margin-top:20px;
    padding:18px;
    background:#14231e;
    border-left:4px solid #42d392;
    border-radius:10px;
    line-height:1.6;
}

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:22px;
}

.result{
    background:#101522;
    border:1px solid #ffffff12;
    border-radius:22px;
    padding:30px;
    margin:35px 0;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:25px 0;
}

.stat{
    background:#171e2d;
    padding:20px;
    text-align:center;
    border-radius:15px;
}

.stat strong{
    display:block;
    font-size:30px;
    margin-bottom:7px;
}

.level{
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.topic{
    display:flex;
    justify-content:space-between;
    background:#171e2d;
    padding:13px;
    margin-top:8px;
    border-radius:10px;
}

.hidden{
    display:none !important;
}

@media(max-width:800px){

    .subjects{
        grid-template-columns:1fr 1fr;
    }

    .answers{
        grid-template-columns:1fr;
    }

}

@media(max-width:520px){

    .subjects{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .question{
        font-size:19px;
    }

    .test{
        padding:17px;
    }

}
</style>
</head>

<header>

    <div class="answers" id="answers"></div>


    <div class="solution hidden" id="solution"></div>


    <div class="navigation">

        <button

        <button
            class="secondary"

        </button>

        <button
            class="startBtn"

        </button>

    </div>

</section>


<!-- NATIJA -->

<section class="result hidden" id="result">

    </button>

    <button

        id="back">
        Fanlarga qaytish
    </button>

</section>

</div>

/* =========================================================
   45 TA SAVOLNI TAYYORLASH (endi bazada har fan uchun
   allaqachon 45 ta noyob savol bor, shuning uchun
   funksiya faqat massivni nusxalab qaytaradi)
========================================================= */

function create45Questions(base){

    let result=[];

    for(let i=0;i<45;i++){

        let original=base[i % base.length];

        result.push({

            topic:original.topic,

            q:original.q,

            a:[...original.a],

            correct:original.correct,

            exp:original.exp

        });

    }

    return result;
}


/* =========================================================
   HAR BIR FAN 45 TA
========================================================= */

let finalBank={};

subjects.forEach(subject=>{

    finalBank[subject]=create45Questions(
        questionBank[subject]
    );

});


/* =========================================================
   FANLARNI EKRANGA CHIQARISH
========================================================= */

const subjectsBox=
document.getElementById("subjects");

subjects.forEach((subject,index)=>{

    const div=document.createElement("div");

    div.className="subject";

    div.innerHTML=`

        <h3>${index+1}. ${subject}</h3>

        <p>
            45 ta savol<br>
            A/B/C/D variantlar<br>
            Natija va tahlil
        </p>

        <button
            class="startBtn"
            onclick="startTest('${subject}')">
            Testni boshlash
        </button>

    `;

    subjectsBox.appendChild(div);

});


/* =========================================================
   TEST HOLATI
========================================================= */

let currentSubject="";
let questions=[];
let currentQuestion=0;
let userAnswers=[];
let startTime=0;
let timerInterval;


/* =========================================================
   VARIANT RAQAMI
========================================================= */

function getVariant(){

    return Math.floor(
        Date.now() / (2 * 60 * 60 * 1000)
    );

}


/* =========================================================
   ARRAY ARALASHTIRISH
========================================================= */

function shuffle(array){

    let copy=[...array];

    for(let i=copy.length-1;i>0;i--){

        let j=Math.floor(
            Math.random()*(i+1)
        );

        [copy[i],copy[j]]=
        [copy[j],copy[i]];

    }

    return copy;

}


/* =========================================================
   TESTNI BOSHLASH
========================================================= */

function startTest(subject){

    currentSubject=subject;

    questions=shuffle(
        finalBank[subject]
    ).slice(0,45);


    questions=questions.map(question=>{

        let options=
            question.a.map(
                (text,index)=>({

                    text:text,

                    correct:
                    index===question.correct

                })
            );


        options=shuffle(options);


        return {

            topic:question.topic,

            q:question.q,

            options:options,

            explanation:question.exp

        };

    });


    currentQuestion=0;

    userAnswers=
        new Array(45).fill(null);


    startTime=Date.now();


    document
        .getElementById("home")
        .classList.add("hidden");


    subjectsBox
        .classList.add("hidden");


    document
        .getElementById("result")
        .classList.add("hidden");


    document
        .getElementById("test")
        .classList.remove("hidden");


    document
        .getElementById("subjectName")
        .textContent=subject;


    document
        .getElementById("variant")
        .textContent=
        "Variant: "+getVariant()+
        " · 45 ta savol";


    clearInterval(timerInterval);

    timerInterval=
        setInterval(updateTimer,1000);


    updateTimer();

    showQuestion();

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

    let seconds=
        Math.floor(
            (Date.now()-startTime)/1000
        );


    let minutes=
        Math.floor(seconds/60);


    let sec=
        seconds%60;


    document
        .getElementById("timer")
        .textContent=
        String(minutes).padStart(2,"0")
        +":"+
        String(sec).padStart(2,"0");

}


/* =========================================================
   SAVOLNI KO‘RSATISH
========================================================= */

function showQuestion(){

    let question=
        questions[currentQuestion];


    document
        .getElementById("counter")
        .textContent=
        `Savol ${currentQuestion+1} / 45`;


    document
        .getElementById("progressBar")
        .style.width=
        ((currentQuestion+1)/45*100)+"%";


    document
        .getElementById("question")
        .textContent=
        question.q;


    let answers=
        document.getElementById("answers");


    answers.innerHTML="";


    question.options.forEach(
        (option,index)=>{

            let button=
                document.createElement("button");


            button.className="answer";


            button.textContent=
                String.fromCharCode(65+index)
                +") "
                +option.text;


            if(
                userAnswers[currentQuestion]
                !==null
            ){

                if(option.correct){

                    button.classList.add(
                        "correct"
                    );

                }


                if(
                    userAnswers[currentQuestion]
                    ===index &&
                    !option.correct
                ){

                    button.classList.add(
                        "wrong"
                    );

                }

            }


            button.onclick=()=>{

                selectAnswer(index);

            };


            answers.appendChild(button);

        }
    );


    let solution=
        document.getElementById("solution");


    if(
        userAnswers[currentQuestion]
        !==null
    ){

        solution.classList.remove(
            "hidden"
        );


        solution.innerHTML=
        "<b>Ishlanishi:</b> "+
        question.explanation;

    }

    else{

        solution.classList.add(
            "hidden"
        );

    }


    document
        .getElementById("previous")
        .disabled=
        currentQuestion===0;


    if(currentQuestion===44){

        document
            .getElementById("next")
            .textContent=
            "Natijani ko‘rish →";

    }

    else{

        document
            .getElementById("next")
            .textContent=
            "Keyingi →";

    }

}


/* =========================================================
   JAVOBNI TANLASH
========================================================= */

function selectAnswer(index){

    if(
        userAnswers[currentQuestion]
        !==null
    ){

        return;

    }


    userAnswers[currentQuestion]=
        index;


    showQuestion();

}


/* =========================================================
   OLDINGI
========================================================= */

document
.getElementById("previous")
.onclick=function(){

    if(currentQuestion>0){

        currentQuestion--;

        showQuestion();

    }

};


/* =========================================================
   KEYINGI
========================================================= */

document
.getElementById("next")
.onclick=function(){

    if(currentQuestion<44){

        currentQuestion++;

        showQuestion();

    }

    else{

        finishTest();

    }

};


/* =========================================================
   TESTNI YAKUNLASH
========================================================= */

document
.getElementById("finish")
.onclick=function(){

    finishTest();

};


/* =========================================================
   NATIJA
========================================================= */

function finishTest(){

    clearInterval(timerInterval);


    let correct=0;
    let wrong=0;


    let topics={};


    questions.forEach(
        (question,index)=>{

            let answer=
                userAnswers[index];


            let isCorrect=
                answer!==null &&
                question.options[answer]
                    .correct;


            if(isCorrect){

                correct++;

            }

            else if(answer!==null){

                wrong++;

            }


            if(
                !topics[question.topic]
            ){

                topics[question.topic]={
                    correct:0,
                    total:0
                };

            }


            topics[
                question.topic
            ].total++;


            if(isCorrect){

                topics[
                    question.topic
                ].correct++;

            }

        }
    );


    let empty=
        45-correct-wrong;


    let percentage=
        correct/45*100;


    document
        .getElementById("correctCount")
        .textContent=
        correct;


    document
        .getElementById("wrongCount")
        .textContent=
        wrong;


    document
        .getElementById("emptyCount")
        .textContent=
        empty;


    /* DARaja */

    let level="";


    if(
        currentSubject==="Ingliz tili"
    ){

        if(percentage>=80){

            level="Yuqori mashq natijasi";

        }

        else if(percentage>=60){

            level="O‘rta mashq natijasi";

        }

        else{

            level="Boshlang‘ich mashq natijasi";

        }


        document
            .getElementById("levelText")
            .textContent=
            "Bu mashq natijasi rasmiy CEFR sertifikatini "
            +"avtomatik belgilamaydi.";

    }

    else if(
        currentSubject==="Iqtisodiyot"
    ){

        level=
            percentage.toFixed(1)
            +"%";


        document
            .getElementById("levelText")
            .textContent=
            "Bu o‘quv mashqi natijasidir.";

    }

    else{

        if(percentage>=70){

            level="A+ ga mos diapazon";

        }

        else if(percentage>=65){

            level="A ga mos diapazon";

        }

        else if(percentage>=60){

            level="B+ ga mos diapazon";

        }

        else if(percentage>=55){

            level="B ga mos diapazon";

        }

        else if(percentage>=50){

            level="C+ ga mos diapazon";

        }

        else if(percentage>=46){

            level="C ga mos diapazon";

        }

        else{

            level="46% dan past";

        }


        document
            .getElementById("levelText")
            .textContent=
            "Bu taxminiy mashq natijasi. "
            +"Rasmiy sertifikat natijasi rasmiy "
            +"baholash tizimi orqali aniqlanadi.";

    }


    document
        .getElementById("level")
        .textContent=
        level;


    /* MAVZULAR */

    let topicBox=
        document.getElementById("topics");


    topicBox.innerHTML="";


    Object
    .entries(topics)
    .forEach(([name,data])=>{

        let div=
            document.createElement("div");


        div.className="topic";


        div.innerHTML=`

            <span>${name}</span>

            <b>
                ${data.correct}/${data.total}
            </b>

        `;


        topicBox.appendChild(div);

    });


    document
        .getElementById("test")
        .classList.add("hidden");


    document
        .getElementById("result")
        .classList.remove("hidden");


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}
